# control_daemon configuration. Every value shown is the default.

[serial]
port = "/dev/elrs_tx"       # udev symlink to the internal UART (design §9.3)
baud = 921600               # must match the TX module's handset baud rate

[input]
# Substrings of evdev device names; all must be present or the daemon stays disarmed.
devices = ["adc-joystick", "gpio-keys"]
mapping = "/etc/rc/mapping.toml"
calibration = "/var/lib/rc/calibration.toml"
grab = true

[ipc]
socket_path = "/run/rc/control.sock"

[safety]
arm_hold_ms = 1000
override_max_delta_us = 100
override_max_ttl_ms = 1000
override_disarmed_max_ttl_ms = 60000

[telemetry]
link_stale_ms = 800         # no LINK_STATISTICS for this long: "ELRS lost" alarm
battery_stale_ms = 3000
status_stale_ms = 3000
lq_alarm = 50               # uplink LQ below this: "ELRS degraded" alarm

[tx]
default_interval_us = 4000  # until OPENTX_SYNC arrives
min_interval_us = 1000
max_interval_us = 50000
rt_priority = 50            # SCHED_FIFO; 0 = off
mlock = true
