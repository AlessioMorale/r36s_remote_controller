[package]
name = "control_daemon"
description = "Handheld control daemon: gamepad -> CRSF -> ELRS TX module (design §3.1)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "control_daemon"
path = "src/main.rs"

[[bin]]
name = "ctl"
path = "src/bin/ctl.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
elrs_crsf = { path = "../elrs_crsf" }
env_logger.workspace = true
libc.workspace = true
log.workspace = true
nix.workspace = true
serde.workspace = true
serde_json.workspace = true
serialport.workspace = true
toml.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"

[dev-dependencies]
tempfile.workspace = true
test_tools = { path = "../test_tools" }
