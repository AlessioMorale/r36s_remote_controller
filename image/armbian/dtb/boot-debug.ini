odroidgoa-uboot-config

# Diagnostic variant of boot.ini: same boot flow, but records each step's result in
# bootdebug.txt on the BOOT partition (U-Boot output is otherwise only on the UART).
# Copy over boot.ini, boot once, read BOOT/bootdebug.txt, then put boot.ini back.

setenv PanelNum 0
setenv PanelPath "ScreenFiles/Panel 0"
setenv PanelPathSlash "ScreenFiles/Panel 0/"

# same scratch area and export/fatwrite pattern as PanCho.ini's SaveLogoEnv
setenv dbg_addr "0x00800800"
setenv savedbg 'mw.b ${dbg_addr} 0 0x1000; env export -t ${dbg_addr} dbg; fatwrite mmc 1:1 ${dbg_addr} bootdebug.txt ${filesize}'
setenv dbg "start"
run savedbg

setenv dtb_loadaddr     "0x01f00000"
setenv loadaddr         "0x02000000"

if load mmc 1:2 ${loadaddr} boot/Image
then
    setenv dbg "${dbg} image=${filesize}"
else
    setenv dbg "${dbg} image=FAIL"
fi

setexpr initrd_loadaddr ${loadaddr} + ${filesize}
setexpr initrd_loadaddr ${initrd_loadaddr} + 0x01000000
setenv dbg "${dbg} initrd_addr=${initrd_loadaddr}"

if load mmc 1:2 ${initrd_loadaddr} boot/uInitrd
then
    setenv dbg "${dbg} initrd=${filesize}"
else
    setenv dbg "${dbg} initrd=FAIL"
fi

if load mmc 1:1 ${dtb_loadaddr} "${PanelPath}/rk3326-gameconsole-r36s-merged.dtb"
then
    setenv dbg "${dbg} dtb=${filesize}"
else
    setenv dbg "${dbg} dtb=FAIL"
fi

if fdt addr ${dtb_loadaddr}
then
    setenv dbg "${dbg} fdt=ok"
else
    setenv dbg "${dbg} fdt=BAD"
fi

setenv bootargs "root=LABEL=armbian rootwait rw fbcon=rotate:0 panic=0 consoleblank=0 console=ttyS2,115200 console=tty0 panel=${PanelNum} PanelNum=${PanelNum}"
setenv dbg "${dbg} booti"
run savedbg

booti ${loadaddr} ${initrd_loadaddr} ${dtb_loadaddr}

# only reached if booti returns
setenv dbg "${dbg} booti=RETURNED"
run savedbg
sleep 15
poweroff
