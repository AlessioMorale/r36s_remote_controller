# Armbian build configuration for the handheld: minimal headless trixie on the R36S.
# Copy to <R36S-Armbian>/userpatches/ (see README.md).
#
# STATUS: not built (plan T1.1 needs the Armbian build host and the device). The board name
# and branch must match the R36S-Stuff/R36S-Armbian fork you build from; the values below
# follow its existing bookworm config and have to be checked against it.

BOARD="r36s"
BRANCH="current"
RELEASE="trixie"
BUILD_MINIMAL="yes"
BUILD_DESKTOP="no"
KERNEL_CONFIGURE="no"
COMPRESS_OUTPUTIMAGE="sha,img"
INSTALL_HEADERS="no"
# Our packages and units are installed by userpatches/customize-image.sh
